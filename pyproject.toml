[project]
name = "bar-cost-demo"
version = "0.1.0"
description = "bar-cost-demo"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
bar-cost-demo = "bar_cost_demo.__main__:main"

[dependency-groups]
dev = [
    "ruff==0.17.6",
    "pyright==1.1.414",
    "pytest==9.2.0",
    "import-linter==2.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bar_cost_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pyright]
include = ["src", "tests", "scripts"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.importlinter]
root_package = "bar_cost_demo"

[[tool.importlinter.contracts]]
name = "features sit on top of core"
type = "layers"
layers = ["bar_cost_demo.features", "bar_cost_demo.core"]

[[tool.importlinter.contracts]]
name = "features do not import each other"
type = "independence"
modules = ["bar_cost_demo.features.*"]
